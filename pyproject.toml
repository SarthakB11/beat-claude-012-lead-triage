[project]
name = "beat-claude-012-lead-triage"
version = "0.1.0"
description = "First-pass triage of inbound marketing leads: rules in code, one LLM call per clean lead."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
triage = "lead_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_triage"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
